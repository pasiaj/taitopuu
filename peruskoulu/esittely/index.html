<canvas id="cv"></canvas>
<div id="hud"><div class="g" id="hg"></div><div class="s" id="hs"></div></div>

<div id="card" class="out"><div class="step" id="cstep"></div><h2 id="ch"></h2><div id="cb"></div></div>

  <button class="btn" id="prev" aria-label="Edellinen">←</button>

<div id="intro">
  <div>
    <h1>Mitä peruskoulussa oikeastaan opitaan?</h1>
    <p>Peruskoulun opetussuunnitelma on satoja sivuja tekstiä. Jaottelin sen taidoiksi ja piirsin niistä pelin taitopuun: kartan kaikesta, mitä huippuoppilas osaa, kun peruskoulu loppuu.</p>
    <button class="btn gold" id="start">Aloita kierros</button>
    <p style="margin:18px auto 0;font-size:14px;color:var(--muted)">Pasi A Jokinen · <a href="https://pasiaj.com/" rel="author" style="color:var(--muted)">pasiaj.com</a></p>
    <p style="margin-top:28px;font-size:14px"><span data-katso></span></p>
  </div>
</div>

<script src="../data.js"></script>
<script src="../puu.js"></script>
<script src="../katso-myos.js"></script>
<script>
(function () {
  'use strict';
  if (new URLSearchParams(location.search).has('kuva')) document.body.classList.add('kuva');
  const M = Puu.build(window.TAITOPUU);
  const V = new Puu.View(document.getElementById('cv'), M, { crossLinks: false });
  window.addEventListener('resize', () => V.resize());
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const all = V.fitAll(0.92);
  const KUVA = document.body.classList.contains('kuva');
  V.cam = { x: 0, y: 0, z: all.z * (KUVA ? 1.25 : 0.6) };
  V.grade = 10; V.focus = new Set([M.root]);

  const N = M.nodes, A = M.areas;
  const os = N.filter(n => n.t === 1), aiheet = N.filter(n => n.t === 2), atomit = N.filter(n => n.t === 0);
  const crossCount = M.prereq.filter(p => p[2]).length;

  /* ------------------------------------------------ esimerkkien valinta datasta */
  function prefer(list, regexes, ok) {
    for (const r of regexes) { const f = list.find(n => r.test(n.n) && (!ok || ok(n))); if (f) return f; }
    return list.find(n => !ok || ok(n)) || list[0];
  }
  const exOs = prefer(os.filter(n => n.a === 'MA' && n.kids.length >= 3),
                      [/murtolu/i, /yhtälö/i, /prosent/i, /kertolas/i], n => n._s >= 2 && n._s <= 6);
  const exAtom = exOs.kids.slice().sort((a, b) => a._s - b._s)[0];
  const exAihe = M.byId.get(exOs.p), exArea = exOs.area;

  // oppiaine, joka on levinnein: eniten eri alueita
  const spread = {};
  os.forEach(n => (n.op || []).forEach(s => { (spread[s] = spread[s] || new Set()).add(n.a); }));
  const tagCand = Object.entries(spread).filter(([s]) => !['AI', 'MA', 'EN'].includes(s)).sort((a, b) => b[1].size - a[1].size);
  const exTag = (tagCand.find(([s]) => s === 'YO') || tagCand[0])[0];
  const exTagAreas = spread[exTag].size;

  // polku: osataito, jonka edellytyksiä on eniten eri alueilta (7–9)
  function pathAreas(n) { const s = Puu.closure(n); return new Set([...s].map(x => x.a)).size; }
  const pathCand = os.filter(n => n._s >= 7 && n.need.some(m => m.a !== n.a)).map(n => [pathAreas(n), Puu.closure(n).size, n]);
  pathCand.sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  const exPath = (pathCand.find(c => ['LT', 'MP', 'YH', 'HI'].includes(c[2].a) && c[1] < 120) || pathCand[0] || [0, 0, os[0]])[2];

  // kriteeri: sama taito arvosanoilla 8 ja 9
  const critPick = (() => {
    const pref = ['MA', 'LT', 'HI', 'KI', 'MP', 'YH'];
    const ordered = os.slice().sort((a, b) => ((pref.indexOf(a.a) + 99) % 99) - ((pref.indexOf(b.a) + 99) % 99));
    for (const n of ordered) {
      if (!n.c) continue;
      const g8 = n.c.find(c => /7–9.*arvosana 8/.test(c[1])), g9 = n.c.find(c => /7–9.*arvosana 9/.test(c[1]));
      if (g8 && g9 && /prosent|yhtälö|lähte|tutki|päätel|argument/i.test(n.n + g9[2])) return [n, g8, g9];
    }
    for (const n of os) { if (!n.c) continue;
      const g8 = n.c.find(c => /arvosana 8/.test(c[1])), g9 = n.c.find(c => /arvosana 9/.test(c[1])); if (g8 && g9) return [n, g8, g9]; }
    return null;
  })();

  const hud = (g, s) => { $('hg').textContent = g || ''; $('hs').textContent = s || ''; };
  const fit = (list, pad) => V.fitNodes(list, pad);
  // kortti peittää osan ruudusta: sovitetaan näkyvään osaan
  const shift = t => {
    if (innerWidth > 760) { t.z *= Math.min(1, (V.w - 520) / V.w + 0.08); t.x -= 250 / t.z; }
    else { t.z *= 0.58; t.y += V.h * 0.2 / t.z; }
    return t;
  };
  const desc = n => [n, ...n.kids.flatMap(desc)];
  const anc = n => { const out = []; let c = n.p && M.byId.get(n.p); while (c) { out.push(c); c = c.p && M.byId.get(c.p); } return out; };

  /* ----------------------------------------------------------- kohtaukset */
  let timers = [];
  const later = (ms, f) => timers.push(setTimeout(f, ms));
  const every = (ms, f) => { const id = setInterval(f, ms); timers.push(id); return id; };
  const clear = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };
  const lit = list => { V.focus = new Set([M.root, ...list]); V.dirty = true; };
  const add = list => { list.forEach(n => V.focus.add(n)); V.dirty = true; };

  const S = [
    {
      h: 'Yksi pieni asia',
      b: () => `<p>Kaikki alkaa yksittäisestä asiasta. Tämä valopiste on <span class="k">käsite</span>, pienin palanen, jonka oppilas oppii tunnistamaan.</p>
        <p><span class="k">${esc(exAtom.n)}</span>${exAtom.k ? `: ${esc(exAtom.k)}` : ''}</p>
        <p><small>Tämä opitaan yleensä ${exAtom._s}. luokalla.</small></p>`,
      go() {
        V.grade = 10; V.sel = exAtom; lit([exAtom]);
        V.flyTo(shift({ x: exAtom.x, y: exAtom.y, z: 2.6 }), 2200);
        hud(`${exAtom._s}. luokka`, exArea.n);
      }
    },
    {
      h: 'Atomeista syntyy taito',
      b: () => `<p>Muutamasta käsitteestä syntyy <span class="k">taito</span>, jotain mitä oppilas osaa <em>tehdä</em>.</p>
        <p><span class="k">${esc(exOs.n)}</span>: ${esc(exOs.o || exOs.k || '')}</p>
        <p><small>Viivat näyttävät, mistä käsitteistä taito koostuu.</small></p>`,
      go() {
        V.sel = exOs; lit([exAtom]); hud(`${exOs._s}. luokalta`, exArea.n);
        V.flyTo(shift(fit([exOs, ...exOs.kids], 0.35)), 1600);
        exOs.kids.forEach((k, i) => later(700 + i * 450, () => add([k])));
        later(900 + exOs.kids.length * 450, () => add([exOs]));
      }
    },
    {
      h: 'Taidoista kokonaisuus',
      b: () => `<p>Toisiinsa liittyvät taidot muodostavat <span class="k">aiheen</span>, esimerkiksi <span class="k">${esc(exAihe.n)}</span>.</p>
        <p>Aihe on hallussa, kun sen taidot ovat. 9. luokalla huippuoppilas osaa yhdistellä aiheen taitoja keskenään.</p>`,
      go() {
        V.sel = exAihe; lit(desc(exOs)); hud(exAihe.n, exArea.n);
        V.flyTo(shift(fit(desc(exAihe), 0.6)), 1500);
        exAihe.kids.filter(k => k !== exOs).forEach((k, i) => later(500 + i * 260, () => add(desc(k))));
        later(700 + exAihe.kids.length * 260, () => add([exAihe]));
      }
    },
    {
      h: 'Kokonaisuuksista osaamisalue',
      b: () => `<p>Aiheet kokoontuvat <span class="k">osaamisalueeksi</span>. Tämä on <span class="k">${esc(exArea.n)}</span>: ${exArea.kids.length} aihetta ja ${exArea.kids.reduce((s, a) => s + a.kids.length, 0)} taitoa.</p>
        <p>Alue on puun haara. Se lähtee keskeltä, ja mitä kauempana keskustasta taito on, sitä pidemmälle asiassa on edetty.</p>`,
      go() {
        V.sel = exArea; lit(desc(exAihe)); hud(exArea.n, `${desc(exArea).length} solmua`);
        V.flyTo(shift(fit([exArea, ...desc(exArea)], 0.75)), 1600);
        exArea.kids.filter(k => k !== exAihe).forEach((k, i) => later(400 + i * 300, () => add(desc(k))));
        later(500 + exArea.kids.length * 300, () => add([exArea]));
      }
    },
    {
      h: 'Koko peruskoulu',
      b: () => `<p>Jaottelin peruskoulun oppimäärän <span class="k">${A.length} osaamisalueeseen</span>, ja niissä on yhteensä ${aiheet.length} aihetta, ${os.length} taitoa ja ${atomit.length} käsitettä.</p>
        <p>Jako on oma. Opetushallituksen opetussuunnitelma jakaa sisällöt oppiaineisiin ja seitsemään laaja-alaiseen osaamiseen, ja puun voi järjestää myös niiden mukaan. Taidot, kriteerit ja tavoitteet tulevat suoraan opetussuunnitelmasta.</p>`,
      go() {
        V.sel = null; lit(desc(exArea));
        V.flyTo(shift(V.fitAll(0.9)), 1800);
        A.filter(a => a !== exArea).forEach((a, i) => later(600 + i * 170, () => { add(desc(a)); hud(a.n, `${i + 2} / ${A.length}`); }));
        later(900 + A.length * 170, () => { V.focus = null; V.dirty = true; hud('', ''); });
      }
    },
    {
      h: 'Taidot, ei oppiaineet',
      b: () => `<p>Jaottelin alueet taitojen enkä oppiaineiden mukaan, koska sama taito palvelee usein montaa ainetta.</p>
        <p>Valaistuina ovat taidot, joita <span class="k">${esc(Puu.OPPIAINEET[exTag] || exTag)}</span> opettaa. Ne jakautuvat <span class="k">${exTagAreas} osaamisalueelle</span>.</p>`,
      go() {
        V.sel = null; V.focus = null; V.filter = exTag; V.dirty = true;
        V.flyTo(shift(V.fitAll(0.95)), 1200);
        hud(Puu.OPPIAINEET[exTag] || exTag, `${exTagAreas} osaamisaluetta`);
      },
      leave() { V.filter = null; }
    },
    {
      h: 'Taidot nojaavat toisiinsa',
      b: () => `<p>Taidot myös rakentuvat toistensa päälle. Taito <span class="k">${esc(exPath.n)}</span> tarvitsee pohjakseen taitoja ${pathAreas(exPath) - 1} muulta alueelta.</p>
        <p>Katkoviivat ovat <span class="k">edellytyksiä</span>. Koko puussa niitä on ${M.prereq.length}, ja ${crossCount} niistä ylittää alueiden rajat.</p>`,
      go() {
        V.filter = null; V.sel = exPath;
        const set = Puu.closure(exPath); anc(exPath).forEach(a => set.add(a));
        const list = [...set];
        lit([exPath]);
        V.flyTo(shift(fit(list, 0.75)), 1600);
        const order = list.filter(n => n !== exPath).sort((a, b) => Math.hypot(a.x - exPath.x, a.y - exPath.y) - Math.hypot(b.x - exPath.x, b.y - exPath.y));
        const step = Math.max(12, 2200 / order.length);
        order.forEach((n, i) => later(500 + i * step, () => add([n])));
        hud(exPath.area.n, `${set.size} solmua polulla`);
      }
    },
    {
      h: 'Luokka kerrallaan',
      b: () => `<p>Kaikkea ei opita yhtä aikaa. Katso, miten puu syttyy luokka luokalta: jokainen taito alkaa tietyllä luokalla ja vahvistuu vuosi vuodelta.</p>
        <p><small>Mitä kirkkaampi taito, sitä pidemmällä siinä ollaan. Täysi loisto tarkoittaa 9. luokan huipputasoa.</small></p>`,
      go() {
        V.sel = null; V.focus = null; V.filter = null;
        V.flyTo(shift(V.fitAll(0.95)), 1000);
        let g = 1; V.grade = 1; V.dirty = true;
        const show = () => { const c = os.filter(n => n._s <= g).length; hud(`${g}. luokka`, `${c} / ${os.length} taitoa aloitettu`); };
        show();
        const id = every(1500, () => { g++; if (g > 9) { clearInterval(id); return; } V.grade = g; V.dirty = true; show(); });
      }
    },
    {
      h: 'Huippuoppilas',
      b: () => critPick ? `<p>Opetussuunnitelman arviointikriteerit kertovat, mitä eri arvosanoihin vaaditaan. Taidossa <span class="k">${esc(critPick[0].n)}</span> ero on tämä:</p>
        <q><small>Arvosana 8</small><br>${esc(critPick[1][2])}</q>
        <q><small>Arvosana 9</small><br>${esc(critPick[2][2])}</q>
        <p>Kriteerit on lainattu sanatarkasti. Puun jokaiseen taitoon on kuvattu myös huipputaso, eli arvosanan 9 taso.</p>`
        : `<p>Puun jokainen taito on kuvattu huipputasolle: arvosanan 9 tasolle 9. luokan lopussa.</p>`,
      go() {
        V.grade = 10; V.focus = null; V.filter = null; V.dirty = true;
        const n = critPick ? critPick[0] : os[0];
        V.sel = n;
        V.flyTo(shift(fit([n, ...n.kids, ...n.need], 0.45)), 1600);
        hud('Huippu', '9. luokan lopussa');
      }
    },
    {
      h: 'Tutki itse',
      b: () => `<p>Näin puuta luetaan:</p>
        <p>• <span class="k">pienet pisteet</span> ovat käsitteitä, <span class="k">isommat</span> taitoja ja aiheita<br>
        • <span class="k">haarat</span> ovat osaamisalueita, joihin jaottelin oppimäärän<br>
        • <span class="b">katkoviivat</span> näyttävät, mitä taito vaatii<br>
        • <span class="k">luokkasäädin</span> näyttää, mitä missäkin vaiheessa osataan<br>
        • <span class="k">Järjestä</span>-valinta näyttää saman puun oppiaineittain tai laaja-alaisittain</p>
        <p><a class="btn gold" href="../">Avaa taitopuu →</a></p><p style="font-size:13px;color:var(--muted)"><span data-katso></span></p><p style="font-size:13px;color:var(--muted);margin-top:4px">Tekijä: <a href="https://pasiaj.com/" rel="author" style="color:var(--muted)">Pasi A Jokinen</a></p>`,
      go() {
        V.sel = null; V.focus = null; V.grade = 10; V.dirty = true; V.o.crossLinks = true;
        V.flyTo(shift(V.fitAll(0.95)), 1600); hud('', '');
      },
      leave() { V.o.crossLinks = false; }
    }
  ];

  /* ------------------------------------------------------------ navigointi */
  let cur = -1, auto = false, autoT = null;
  const dots = $('dots');
  S.forEach((_, i) => { const d = document.createElement('i'); d.title = S[i].h; d.onclick = () => go(i); dots.appendChild(d); });
  function go(i) {
    if (i < 0 || i >= S.length) return;
    clear();
    if (cur >= 0 && S[cur].leave) S[cur].leave();
    cur = i;
    const c = $('card'); c.classList.add('out');
    setTimeout(() => {
      if (window.katsoMyos) setTimeout(window.katsoMyos, 0);
      $('cstep').textContent = `${i + 1} / ${S.length}`;
      $('ch').textContent = S[i].h; $('cb').innerHTML = S[i].b(); c.classList.remove('out');
    }, 300);
    [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : k < i ? 'done' : ''; });
    S[i].go();
    clearTimeout(autoT);
    if (auto && i < S.length - 1) autoT = setTimeout(() => go(i + 1), i === 7 ? 15000 : 9000);
  }
  $('prev').onclick = () => go(cur - 1);
  $('next').onclick = () => go(cur + 1);
  $('auto').onclick = e => { auto = !auto; e.target.classList.toggle('on', auto); e.target.textContent = auto ? '❚❚ Auto' : '▶ Auto'; if (auto && cur < S.length - 1) autoT = setTimeout(() => go(cur + 1), 2500); else clearTimeout(autoT); };
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if ($('intro').classList.contains('gone')) go(cur + 1); else begin(); }
    if (e.key === 'ArrowLeft') go(cur - 1);
  });
  function begin() { $('intro').classList.add('gone'); go(0); }
  $('start').onclick = begin;
  // ennen aloitusta puu pyörii hitaasti taustalla
  V.focus = null; V.grade = 10; V.o.crossLinks = true; V.dirty = true;
  let spin = 0;
  const idle = setInterval(() => {
    if ($('intro').classList.contains('gone')) { clearInterval(idle); V.o.crossLinks = false; return; }
    if (KUVA) return;   // kuvatilassa puu pysyy paikallaan
    spin += 0.004; V.cam.x = Math.cos(spin) * 300; V.cam.y = Math.sin(spin) * 300; V.dirty = true;
  }, 30);
})();
</script>
</body>
</html>
